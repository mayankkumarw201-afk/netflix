<!DOCTYPE html>
<html lang="en">
<head>
    <title>Netflix Login</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000;
        }
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url(https://blog.farmerswife.com/hubfs/840_560.jpeg);
            background-size: cover;
            background-position: center;
            opacity: 0.5;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 45ch }
            
        }
        .header h1 {
            position: absolute;
            top: 20px;
            left: 40px;
            color: #E50914; 
            font-size: 2.5rem;
            letter-spacing: 1px;
            margin: 0;
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite;
            -o-animation-iteration-count: infinite;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .login-form {
            position: relative;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 60px;
            border-radius: 8px;
            width: 320px;
            color: #fff;
        }

        .login-form h2 {
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 2rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 4px;
            border: none;
            background-color: #333;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        

        .signin-button {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: none;
            background-color: #E50914; 
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        
        }
    
        .signup-text {
            color: #737373;
        }

        .signup-text a {
            color: #fff;
            text-decoration: black;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="background-container"></div>
    
    <header class="header">
        <h1>NETFLIX</h1>
    </header>

    <div class="login-container">
        <div class="login-form">
            <h2>Sign In</h2>
            <form>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type= "password" placeholder="Password" required>
                </div>
                <button type="submit" class="signin-button">Sign In</button>
            </form>
            <p class="signup-text">
                New to Netflix? <a href="#">Sign up now</a>.
            </p>
        </div>
    </div>

</body>
</html>
